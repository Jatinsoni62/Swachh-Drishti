# SWACHH-DRISHTI YOLO Dataset Configuration
# Classes include civic receptacles (dustbin/bucket) to enforce:
# "Spitting into a dustbin/bucket is lawful disposal and NOT a violation"

path: ./dataset # dataset root dir
train: images/train # train images (relative to 'path')
val: images/val # val images (relative to 'path')
test: images/test # optional test images

# Classes definition
names:
  0: person
  1: spitting_violation # Spitting onto public road, sidewalk, wall
  2: dustbin_bucket # Municipal dustbin, spittoon, or collection bucket
  3: compliant_disposal # Spitting action directed into receptacle (NON-VIOLATION)

# Number of classes
nc: 4
